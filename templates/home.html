<!DOCTYPE html>
{% extends 'base.html' %}
{% block title %}Home{% endblock %}

{% block content %}
<section class="hero is-primary is-bold">
  <div class="hero-body">
    <p class="title">
      Geneva Auto
    </p>
  </div>
</section>

<section class="section">
  <div class="columns">
    
    <div class="column">
      <div class="card">
        <div class="card-content">
          <p class="title is-4">Buy Vehicles</p>
          <p>Browse and purchase vehicles from the catalog.</p>
          <a href="{{ url_for('buy') }}" class="button is-primary is-light mt-3">Go</a>
        </div>
      </div>
    </div>

    <div class="column">
      <div class="card">
        <div class="card-content">
          <p class="title is-4">Sell Vehicles</p>
          <p>Manage inventory and post new vehicles.</p>
          <a href="{{ url_for('sell') }}" class="button is-primary is-light mt-3">Go</a>
        </div>
      </div>
    </div>

    <div class="column">
      <div class="card">
        <div class="card-content">
          <p class="title is-4">Reports</p>
          <p>Generate sales and customer reports.</p>
          <a href="{{ url_for('reports') }}" class="button is-primary is-light mt-3">Go</a>
        </div>
      </div>
    </div>

  </div>
</section>
{% endblock %}
