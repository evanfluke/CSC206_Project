{% extends "base.html" %}
{% block title %}Part Statistics{% endblock %}

{% block content %}
<div class="container mt-6">
    <h1 class="title is-3">Part Statistics Report</h1>

    <table class="table is-fullwidth is-striped">
        <thead>
            <tr>
                <th>Vendor</th>
                <th>Total Parts Purchased</th>
                <th>Total Cost ($)</th>
                <th>Average Part Cost ($)</th>
            </tr>
        </thead>

        <tbody>
            {% for row in data %}
            <tr>
                <td>{{ row.vendor }}</td>
                <td>{{ row.count }}</td>
                <td>{{ row.total }}</td>
                <td>{{ row.avg }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
