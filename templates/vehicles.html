{% extends "base.html" %}

{% block content %}
<div class="container m-6">
    <h1 class ="title is-3">Vehicles</h1>
</div>

<table class="table is-striped is-fullwidth">
    <thead>
        <tr>
            <th>VIN</th>
            <th>Make</th>
            <th>Model</th>
            <th>Year</th>
            <th>Mileage</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody>
    {% for v in vehicles %}
    <tr>
        <td>{{ v.id }}</td>
        <td>{{ v.make }}</td>
        <td>{{ v.model }}</td>
        <td>{{ v.year }}</td>
        <td>{{ v.mileage }}</td>
        <td>${{ v.price }}</td>
    </tr>
    {% endfor %}
</tbody>

</table>

{% endblock %}
