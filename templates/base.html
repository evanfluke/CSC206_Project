<!DOCTYPE html>
<html lang = "en">
    
    <head>
        <!-- # {% block head %} -->
        <meta charset="UTF-8"> 
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
        <title>{% block title %}Geneva Auto{% endblock %}</title>
        <!-- # {% endblock %} -->
    </head>

    <body style="min-height: 100vh; display: flex; flex-direction: column;">
        <!-- # header -->
        <header>
           <nav class="navbar is-dark" role="navigation" aria-label="main navigation">
                <div class="navbar-brand">
                    <a class="navbar-item" href="{{ url_for('home') }}">
                    <strong>Geneva Auto</strong>
                    </a>

                    <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="mainNav">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    </a>
                </div>

                <div id="mainNav" class="navbar-menu">
                    <div class="navbar-start">
                    <a class="navbar-item {% if request.endpoint == 'home' %}is-active{% endif %}" href="{{ url_for('home') }}">
                        Home
                    </a>
                    <a class="navbar-item {% if request.endpoint == 'login' %}is-active{% endif %}" href="{{ url_for('login') }}">
                        Login
                    </a>
                    <a class="navbar-item {% if request.endpoint == 'vehicles' %}is-active{% endif %}" href="{{ url_for('vehicles') }}">
                        Vehicles
                    </a>
                    <a class="navbar-item {% if request.endpoint == 'buy' %}is-active{% endif %}" href="{{ url_for('buy') }}">
                        Buy
                    </a>
                    <a class="navbar-item {% if request.endpoint == 'sell' %}is-active{% endif %}" href="{{ url_for('sell') }}">
                        Sell
                    </a>
                    <!-- <a class="navbar-item {% if request.endpoint == 'reports' %}is-active{% endif %}" href="{{ url_for('reports') }}">
                        Reports
                    </a> -->
                        <div class="navbar-item has-dropdown is hoverable">
                            <a class="navbar-link">
                                Reports
                            </a>
                            <div class="navbar-dropdown">
                                <a class="navbar-item" href="{{ url_for('report_sales_productivity') }}">
                                    Sales Productivity
                                </a>
                                <a class="navbar-item" href="{{ url_for('report_seller_history') }}">
                                    Seller History
                                </a>
                                <a class="navbar-item" href="{{ url_for('report_part_statistics') }}">
                                    Part Statisits
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="navbar-end">
                        <div class="navbar-item">
                            {% if session.username %}
                                <span>Welcome, {{ session.username }} ({{ session.role }})</span>
                                <a class="button is-light ml-2" href="{{ url_for('logout') }}">Logout</a>
                            {% else %}
                                <a class="button is-primary" href="{{ url_for('login') }}">Login</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </nav>

        </header>

        <div style="flex: 1">
            {% block content %}

            {% endblock %}
        </div>
        <!--<div id="content">{% block content %}{% endblock %}</div> -->
        <!-- footer -->
        <footer class="footer">
            <div class="content has-text-centered">
                <p>&copy; 2025 Geneva Auto</p>
            </div>
        </footer>

    </body>
</html>
